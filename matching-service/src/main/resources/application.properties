# Application
server.port=8084
spring.application.name=matching-service

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9093
spring.kafka.consumer.group-id=matching-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.rideshare.matchingservice.event.RideRequestedEvent

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Location Service URL
location.service.url=http://localhost:8082

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/Requested_processed_events
spring.datasource.username=root
spring.datasource.password=aman123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Feign Timeout
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000

resilience4j.retry.instances.locationServiceRetry.max-attempts=3
resilience4j.retry.instances.locationServiceRetry.wait-duration=1s

resilience4j.circuitbreaker.instances.locationServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.locationServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.locationServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.locationServiceCircuitBreaker.wait-duration-in-open-state=10s


resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2

  # Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,retries,configprops
management.endpoint.configprops.show-values=always